<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>员工管理系统 - 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-box {
    background: #fff; padding: 40px 36px; border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25); width: 380px;
  }
  .login-box h1 { font-size: 22px; color: #333; margin-bottom: 6px; }
  .login-box .sub { color: #999; font-size: 13px; margin-bottom: 28px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 12px; border: 1px solid #ddd; border-radius: 6px;
    font-size: 14px; outline: none; transition: border .2s;
  }
  .field input:focus { border-color: #667eea; }
  .btn {
    width: 100%; padding: 12px; background: #667eea; color: #fff; border: none;
    border-radius: 6px; font-size: 15px; cursor: pointer; transition: background .2s;
  }
  .btn:hover { background: #5568d3; }
  .btn:disabled { background: #aaa; cursor: not-allowed; }
  .tip { margin-top: 16px; font-size: 12px; color: #999; text-align: center; }
  .error {
    background: #fef0f0; color: #e74c3c; padding: 10px 12px; border-radius: 6px;
    font-size: 13px; margin-bottom: 16px; display: none;
  }
</style>
</head>
<body>
<div class="login-box">
  <h1>员工管理系统</h1>
  <p class="sub">内部管理系统 · 请登录后继续</p>
  <div class="error" id="errBox"></div>
  <div class="field">
    <label>账号</label>
    <input type="text" id="username" placeholder="请输入账号" autocomplete="username">
  </div>
  <div class="field">
    <label>密码</label>
    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
  </div>
  <button class="btn" id="loginBtn" onclick="doLogin()">登 录</button>
  <p class="tip">默认账号：admin / 密码：admin123</p>
</div>

<script src="js/common.js"></script>
<script>
  // 若已登录，直接跳转
  if (getToken()) { location.href = 'index.html'; }

  function showError(msg) {
    const box = document.getElementById('errBox');
    box.textContent = msg;
    box.style.display = 'block';
  }

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    if (!username || !password) { showError('请输入账号和密码'); return; }

    btn.disabled = true; btn.textContent = '登录中...';
    try {
      const res = await request('/api/login', {
        method: 'POST',
        body: JSON.stringify({ username, password }),
      }, false);
      saveToken(res.data.token);
      saveUser(res.data.username);
      location.href = 'index.html';
    } catch (e) {
      showError(e.message || '登录失败');
      btn.disabled = false; btn.textContent = '登 录';
    }
  }

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
